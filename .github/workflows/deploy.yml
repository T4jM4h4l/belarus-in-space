# Простой workflow для развёртывания на GitHub Pages
name: Deploy to GitHub Pages

on:
  # Запуск при пуше в main ветку
  push:
    branches: ['main']
  # Возможность ручного запуска
  workflow_dispatch:

# Установка разрешений для деплоя
permissions:
  contents: read
  pages: write
  id-token: write

# Отмена текущих запусков при появлении новых
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Сборка
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Деплой
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
